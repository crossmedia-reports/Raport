<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Campaigns & Video</title>
<meta name="description" content="Campanii TV monitorizate 2025-2026, Maspex si concurenta, cu link video acolo unde e disponibil.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1a2733;
    --text-muted: #5b6b7a;
    --border: #dde3e9;
    --accent: #F47B20;
    --accent-dark: #C85F12;
    --accent-light: #FDEBDB;
    --pill-bg: #eef2f6;
    --shadow: 0 1px 3px rgba(20,30,40,0.08);
    --header-bg: #B85A16;
    --header-text: #ffffff;
    --row-hover: #FFF3E8;
    --badge-video: #2f7a4f;
    --badge-none: #9aa5ae;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191410;
      --panel: #221a14;
      --text: #f1e6da;
      --text-muted: #c2a98f;
      --border: #3a2c20;
      --accent: #FF9142;
      --accent-dark: #F47B20;
      --accent-light: #3a2413;
      --pill-bg: #2c2119;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
      --header-bg: #150f0a;
      --header-text: #fce9d8;
      --row-hover: #2c2015;
      --badge-video: #4caf7d;
      --badge-none: #6b5d4e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191410;
    --panel: #221a14;
    --text: #f1e6da;
    --text-muted: #c2a98f;
    --border: #3a2c20;
    --accent: #FF9142;
    --accent-dark: #F47B20;
    --accent-light: #3a2413;
    --pill-bg: #2c2119;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --header-bg: #150f0a;
    --header-text: #fce9d8;
    --row-hover: #2c2015;
    --badge-video: #4caf7d;
    --badge-none: #6b5d4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 20px 16px;
  }
  header.top h1 {
    margin: 0 0 4px 0;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top p.note {
    margin: 0;
    font-size: 0.92rem;
    color: rgba(255,255,255,0.85);
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    flex: 1 1 140px;
    min-width: 120px;
  }
  .stat-card .num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent-dark);
  }
  .stat-card .lbl {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .filters {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
    flex: 1 1 160px;
  }
  .field label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  select, input[type="text"] {
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  select:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-light);
  }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 8px;
  }
  .checkbox-field input[type="checkbox"] {
    accent-color: var(--accent);
  }
  .checkbox-field label {
    font-size: 0.85rem;
    color: var(--text);
  }
  .reset-btn {
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--pill-bg);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    height: 36px;
  }
  .reset-btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .table-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-scroll {
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
    min-width: 720px;
    table-layout: fixed;
  }
  th:nth-child(1), td:nth-child(1) { width: 34%; }
  th:nth-child(2), td:nth-child(2) { width: 14%; }
  th:nth-child(3), td:nth-child(3) { width: 12%; }
  th:nth-child(4), td:nth-child(4) { width: 14%; }
  th:nth-child(5), td:nth-child(5) { width: 16%; }
  th:nth-child(6), td:nth-child(6) { width: 10%; }
  td, th {
    overflow-wrap: break-word;
    word-break: break-word;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--accent);
    color: #fff;
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: var(--accent-dark); }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--row-hover); }
  .campaign-name {
    font-weight: 600;
    color: var(--text);
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--text-muted);
    font-size: 0.74rem;
    white-space: nowrap;
  }
  .watch-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff !important;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .watch-btn:hover { background: var(--accent-dark); }
  .no-video {
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  .months-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-muted);
  }
  .footer-note {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
    padding: 18px 0 8px;
  }
  @media (max-width: 640px) {
    .field { min-width: 100%; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Campaigns &amp; Video</h1>
  <p class="note">Campanii TV 2025-2026 — Toate (Maspex + concurenta)</p>
</header>

<div class="wrap">
  <div class="filters">
    <div class="field">
      <label for="fCategory">Categorie</label>
      <select id="fCategory"><option value="">Toate</option></select>
    </div>
    <div class="field">
      <label for="fSub">Sub-categorie</label>
      <select id="fSub"><option value="">Toate</option></select>
    </div>
    <div class="field">
      <label for="fBrand">Brand</label>
      <select id="fBrand"><option value="">Toate</option></select>
    </div>
    <div class="field">
      <label for="fSearch">Cauta campanie</label>
      <input type="text" id="fSearch" placeholder="ex: PEPSI, GAMA...">
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="fHasVideo">
      <label for="fHasVideo">Doar cu video</label>
    </div>
    <button class="reset-btn" id="resetBtn">Reseteaza filtre</button>
  </div>

  <div class="table-panel">
    <div class="table-scroll">
      <table id="dataTable">
        <thead>
          <tr>
            <th data-key="campaign">Campanie</th>
            <th data-key="brand">Brand</th>
            <th data-key="cat">Categorie</th>
            <th data-key="sub">Sub-categorie</th>
            <th data-key="months">Luni difuzare</th>
            <th data-key="video">Video</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">Nicio campanie nu corespunde filtrelor selectate.</div>
  </div>

</div>

let sortKey = 'campaign';
let sortDir = 1;

function norm(s) {
  return (s === null || s === undefined) ? '' : String(s).trim();
}

// Defensive normalization: guarantees exact-match filtering can never be
// broken by stray whitespace in the source data (Category/Sub-Category/Brand/Campaign).
DATA.forEach(r => {
  r.cat = norm(r.cat);
  r.sub = norm(r.sub);
  r.brand = norm(r.brand);
  r.campaign = norm(r.campaign);
});

function uniqueSorted(arr) {
  return Array.from(new Set(arr.map(norm))).filter(Boolean).sort((a,b) => a.localeCompare(b, 'ro'));
}

function populateSelect(sel, values) {
  const current = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  if (values.includes(current)) sel.value = current;
}

function getFilters() {
  return {
    cat: norm(document.getElementById('fCategory').value),
    sub: norm(document.getElementById('fSub').value),
    brand: norm(document.getElementById('fBrand').value),
    search: document.getElementById('fSearch').value.trim().toUpperCase(),
    hasVideo: document.getElementById('fHasVideo').checked,
  };
}

function applyFilters() {
  const f = getFilters();
  let rows = DATA.filter(r => {
    if (f.cat && r.cat !== f.cat) return false;
    if (f.sub && r.sub !== f.sub) return false;
    if (f.brand && r.brand !== f.brand) return false;
    if (f.hasVideo && !r.video) return false;
    if (f.search && !(r.campaign.toUpperCase().includes(f.search) || r.brand.toUpperCase().includes(f.search))) return false;
    return true;
  });

  rows.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') { va = va.toUpperCase(); vb = vb.toUpperCase(); }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  renderTable(rows);

  const catFiltered = f.cat ? DATA.filter(r => r.cat === f.cat) : DATA;
  populateSelect(document.getElementById('fSub'), uniqueSorted(catFiltered.map(r => r.sub)));
  populateSelect(document.getElementById('fBrand'), uniqueSorted(catFiltered.map(r => r.brand)));
}

function renderTable(rows) {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const frag = document.createDocumentFragment();
  rows.forEach(r => {
    const tr = document.createElement('tr');

    const tdCampaign = document.createElement('td');
    tdCampaign.className = 'campaign-name';
    tdCampaign.textContent = r.campaign;
    tr.appendChild(tdCampaign);

    const tdBrand = document.createElement('td');
    tdBrand.textContent = r.brand;
    tr.appendChild(tdBrand);

    const tdCat = document.createElement('td');
    tdCat.innerHTML = '<span class="pill">' + escapeHtml(r.cat) + '</span>';
    tr.appendChild(tdCat);

    const tdSub = document.createElement('td');
    tdSub.textContent = r.sub || '—';
    tr.appendChild(tdSub);

    const tdMonths = document.createElement('td');
    tdMonths.className = 'months-label';
    tdMonths.textContent = r.months;
    tr.appendChild(tdMonths);

    const tdVideo = document.createElement('td');
    if (r.video) {
      tdVideo.innerHTML = '<a class="watch-btn" href="' + escapeAttr(r.video) + '" target="_blank" rel="noopener">&#9654; Watch</a>';
    } else {
      tdVideo.innerHTML = '<span class="no-video">&mdash;</span>';
    }
    tr.appendChild(tdVideo);

    frag.appendChild(tr);
  });
  tbody.innerHTML = '';
  tbody.appendChild(frag);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById('fCategory').addEventListener('change', applyFilters);
document.getElementById('fSub').addEventListener('change', applyFilters);
document.getElementById('fBrand').addEventListener('change', applyFilters);
document.getElementById('fSearch').addEventListener('input', applyFilters);
document.getElementById('fHasVideo').addEventListener('change', applyFilters);
// Lock to a single category when embedded from a dashboard category page
// (e.g. Campaigns_Video.html?cat=Beverages). Opened standalone, no ?cat= is
// present and every category stays selectable, unfiltered, as before.
// Wrapped defensively so that any failure here (malformed URL, etc.) can
// never prevent the dropdowns/table below from rendering.
let lockedCategory = '';
try {
  const urlParams = new URLSearchParams(window.location.search);
  lockedCategory = norm(urlParams.get('cat'));
} catch (e) {
  lockedCategory = '';
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('fCategory').value = lockedCategory || '';
  document.getElementById('fSub').value = '';
  document.getElementById('fBrand').value = '';
  document.getElementById('fSearch').value = '';
  document.getElementById('fHasVideo').checked = false;
  applyFilters();
});

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.getAttribute('data-key');
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    applyFilters();
  });
});

populateSelect(document.getElementById('fCategory'), uniqueSorted(DATA.map(r => r.cat)));
populateSelect(document.getElementById('fSub'), uniqueSorted(DATA.map(r => r.sub)));
populateSelect(document.getElementById('fBrand'), uniqueSorted(DATA.map(r => r.brand)));

try {
  if (lockedCategory && DATA.some(r => r.cat === lockedCategory)) {
    const fCategory = document.getElementById('fCategory');
    fCategory.value = lockedCategory;
    fCategory.disabled = true;
    fCategory.title = 'Categoria este stabilita de pagina din dashboard';
  }
} catch (e) {
  // Never let the category-lock UI touch-up break the page; dropdowns above
  // are already populated and the table below still renders unfiltered.
}

applyFilters();
</script>
</body>
</html>
